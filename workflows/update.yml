name: Automated Daily Market Ingestion & Forecast Pipeline

on:
  schedule:
    # Run daily at 14:00 UTC (15:00 CET/CEST), immediately after Day-Ahead auction clearing
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Number of past weekly chunks to fetch'
        required: false
        default: '8'

permissions:
  contents: write

jobs:
  update-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Run Data Pipeline
        run: |
          python pipeline.py --weeks ${{ github.event.inputs.weeks || 4 }}

      - name: Commit & Push Updated Market Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/strom_waechter.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): automated daily market update [skip ci]"
            git push origin main
          fi
